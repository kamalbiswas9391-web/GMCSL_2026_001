<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — GMCSL Society Management System</title>
    <style>
      body {
        margin: 0;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        background: #F4F7F6;
        color: #1D2939;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        max-width: 480px;
        width: 100%;
        background: #FFFFFF;
        border: 1px solid #E2E8F0;
        border-radius: 16px;
        padding: 32px;
        box-shadow: 0 10px 30px rgba(20, 45, 78, 0.08);
        text-align: center;
      }
      .badge {
        display: inline-block;
        padding: 6px 12px;
        background: #FEF3C7;
        color: #92400E;
        font-size: 12px;
        font-weight: 700;
        border-radius: 6px;
        margin-bottom: 16px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 22px;
        color: #142D4E;
      }
      p {
        margin: 0 0 24px;
        font-size: 14px;
        line-height: 1.6;
        color: #667085;
      }
      .btn {
        display: inline-block;
        background: #087443;
        color: #FFFFFF;
        padding: 12px 24px;
        border-radius: 10px;
        text-decoration: none;
        font-weight: 600;
        font-size: 14px;
        border: none;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">OFFLINE MODE ACTIVE</div>
      <h1>GMCSL Society Management System</h1>
      <p>
        Internet connectivity is currently unavailable. Cached application screens and previously synchronized IndexedDB records remain accessible when opened from your installed app shell.
      </p>
      <button class="btn" onclick="window.location.href='/'">Return to Cached App</button>
    </div>
  </body>
</html>
